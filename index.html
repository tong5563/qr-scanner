<!DOCTYPE html>
<html>
<head>
  <title>二维码扫描</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    #reader {
      width: 300px;
      margin: auto;
    }
    #flashlightControls, #manualInput, #result {
      margin-top: 20px;
    }
    .card {
      background: #f9f9f9;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: inline-block;
      margin-top: 15px;
    }
    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 5px;
    }
  </style>
</head>
<body>
  <h2>📷二维码扫描器</h2>
  <div id="reader"></div>

  <!-- Flashlight buttons -->
  <div id="flashlightControls">
    <button onclick="turnOnFlash()">🔦 Turn ON Flash</button>
    <button onclick="turnOffFlash()">💡 Turn OFF Flash</button>
  </div>

  <!-- Manual QR entry -->
  <div id="manualInput">
    <h3>📝 Or Enter Code Manually</h3>
    <input type="text" id="manualQR" placeholder="Enter code here">
    <button onclick="manualSearch()">Search</button>
  </div>

  <!-- Result display -->
  <div id="result"></div>

  <script>
    const html5QrCode = new Html5Qrcode("reader");
    const apiUrl = "https://script.google.com/macros/s/AKfycbzvxrrFf0ZqPI3WH-rvs1jfFurkY78txY9Hqk21wfFXyP3mIMm7guDcBN4LIH-OENDs/exec";

    function showResult(qrCode) {
      document.getElementById('result').innerHTML = `<div><b>Scanned:</b> ${qrCode}</div>`;

      fetch(`${apiUrl}?qr=${encodeURIComponent(qrCode)}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            document.getElementById('result').innerHTML += `<div style="color:red;"><b>${data.error}</b></div>`;
          } else {
            document.getElementById('result').innerHTML += `
              <div class="card">
                <b>✅ Match Found</b><br><br>
                <b>名字:</b> ${data.productName || 'N/A'}<br>
                <b>联系:</b> ${data.details || 'N/A'}<br>
                <b>地址:</b> ${data.extraInfo || 'N/A'}
              </div>`;
          }
        }).catch(err => {
          document.getElementById('result').innerHTML += `<div style="color:red;">Fetch error: ${err}</div>`;
        });
    }

    function manualSearch() {
      const val = document.getElementById('manualQR').value.trim();
      if (val) {
        showResult(val);
      }
    }

    function turnOnFlash() {
      html5QrCode.applyVideoConstraints({ torch: true }).catch(() => {
        alert("Flashlight not supported on this device.");
      });
    }

    function turnOffFlash() {
      html5QrCode.applyVideoConstraints({ torch: false }).catch(() => {
        alert("Flashlight not supported on this device.");
      });
    }

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: 250,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.UPC_A
        ]
      },
      decodedText => {
        html5QrCode.stop().then(() => {
          showResult(decodedText);
          setTimeout(() => html5QrCode.start(...arguments), 2000);
        });
      }
    ).catch(err => {
      document.getElementById('result').innerHTML = `<div style="color:red;">Camera error: ${err}</div>`;
    });
  </script>
</body>
</html>
